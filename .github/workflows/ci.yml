name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    if: &not-release-please ${{ !startsWith(github.head_ref, 'release-please--') && !contains(github.event.head_commit.message, '/release-please--') }}
    permissions:
      contents: read
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: 'go.mod'
          cache: false

  golangci-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: false
      # golangci-lint refuses to lint code for a newer Go than it was built
      # with, and the release binaries can lag behind go.mod. goinstall builds
      # it with the Go set up above, so the two always match.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: 'latest'
          install-mode: goinstall
          skip-cache: true

  go-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: false
      # The race detector needs cgo and a C compiler. SQLite is pure Go
      # (modernc.org/sqlite), so the tests themselves don't.
      - name: Run tests
        run: |
          if command -v "$(go env CC)" >/dev/null; then
            go test -race -count=1 ./...
          else
            echo "::warning::no C compiler on this runner, so the tests ran without -race"
            CGO_ENABLED=0 go test -count=1 ./...
          fi
