name: Security Scans

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job skips release-please PRs (head branch release-please--…) and the
# push to main that merges one. Those only touch CHANGELOG.md and the version
# manifest, and the code was already scanned on its own PR and merge. The jobs
# are skipped rather than the workflow filtered out, so required checks still
# pass. The condition is defined once below and reused with a YAML alias.
jobs:
  govulncheck:
    if: &not-release-please ${{ !startsWith(github.head_ref, 'release-please--') && !contains(github.event.head_commit.message, '/release-please--') }}
    permissions:
      contents: read
    runs-on: k3s-runners-ots
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: 'go.mod'
          cache: false
  gosec:
    if: *not-release-please
    permissions:
      contents: read
      actions: read
    runs-on: k3s-runners-ots
    env:
      GO111MODULE: on
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Run Gosec
        run: |
          echo "Running go sec"
          # Pinned to a master commit: v2.29.0 ships x/tools v0.49.0, which can't
          # read Go 1.27 export data. Move to the next release once it's out.
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.1-0.20261019114157-bbd69e23f657
          gosec -fmt sarif -out gosec_results.sarif ./...
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gosec_results.sarif
          path: gosec_results.sarif
      - name: Send to gosec viewer
        if: ${{ !cancelled() && vars.GOSEC_VIEWER_URL != '' && hashFiles('gosec_results.sarif') != '' }}
        continue-on-error: true # the viewer being down shouldn't fail the scan
        env:
          VIEWER_URL: ${{ vars.GOSEC_VIEWER_URL }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # Report names can't contain "/", so feat/foo becomes feat-foo.
          name="${BRANCH//\//-}"
          echo "DEBUG: ${name}"
          curl -sS --fail-with-body -X PUT -H 'Content-Type: application/json' \
            --data-binary @gosec_results.sarif "${VIEWER_URL}/api/reports/${name}"
  sbom-and-grype:
    if: *not-release-please
    runs-on: k3s-runners-ots
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: cyclonedx-json
          output-file: opentripsplit.json
          artifact-name: opentripsplit.json
      # upload_observations only imports vulnerabilities, so the SBOM needs upload_sbom.
      - name: Send SBOM to SecObserve
        if: ${{ !cancelled() && hashFiles('opentripsplit.json') != '' }}
        uses: SecObserve/secobserve_actions_templates/actions/upload_sbom@e1d37e1488c479465b7853ad88bb2c12441a06c6 # v2026_11
        with:
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_file_name: opentripsplit.json
          so_product_name: ${{ vars.SO_PRODUCT_NAME }}
          so_api_base_url: ${{ secrets.SO_API_BASE_URL }}
          so_branch_name: ${{ github.head_ref || github.ref_name }}
      - name: Scan SBOM
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          sbom: opentripsplit.json
          fail-build: true
          severity-cutoff: high
          output-format: cyclonedx-json
          output-file: grype_repo_results.json
      # SecObserve resolves observations missing from a re-upload with the same product, branch
      # and file name. Keep this name distinct from build.yml's grype_results.json so the two
      # scans don't resolve each other's findings.
      - name: Send Grype results to SecObserve
        if: ${{ !cancelled() && hashFiles('grype_repo_results.json') != '' }}
        uses: SecObserve/secobserve_actions_templates/actions/upload_observations@e1d37e1488c479465b7853ad88bb2c12441a06c6 # v2026_11
        with:
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_file_name: grype_repo_results.json
          so_product_name: ${{ vars.SO_PRODUCT_NAME }}
          so_api_base_url: ${{ secrets.SO_API_BASE_URL }}
          so_branch_name: ${{ github.head_ref || github.ref_name }}
  trufflehog:
    if: *not-release-please
    runs-on: k3s-runners-ots
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # trufflehog scans base..head, which a shallow clone doesn't have
      # Manual runs would otherwise scan all history, which includes an old test DATABASE_URL.
      # Pass the default branch as a commit SHA: trufflehog scanned nothing when given "origin/main".
      - name: Resolve scan range for manual runs
        id: range
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base=$(git rev-parse "origin/$DEFAULT_BRANCH")
          echo "Scanning $base..$GITHUB_SHA"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          base: ${{ steps.range.outputs.base }}
          head: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          extra_args: --results=verified,unknown
