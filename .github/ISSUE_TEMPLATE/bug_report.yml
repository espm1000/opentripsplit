name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues:** please don't file them here; see SECURITY.md.
        Please don't paste real names, provider IDs or other personal data from your instance.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a group in JPY
        2. Add an expense split by percent
        3. ...
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
  - type: dropdown
    id: deploy
    attributes:
      label: How do you run it?
      options:
        - Docker
        - Binary built from source
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: text
