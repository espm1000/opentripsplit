version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  exclusions:
    presets:
      - std-error-handling # unchecked Close() and similar
      - common-false-positives
    rules:
      # Tests use seeded math/rand and helpers that close bodies themselves.
      - path: _test\.go
        linters: [gosec, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/espm1000/opentripsplit
